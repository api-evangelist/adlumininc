authentication:
  style: bearer
  header: Authorization
  format: 'Bearer <JWT>'
  scope: per-tenant
  docs: https://developer.n-able.com/adlumin/reference/get_detections
  note: >-
    Single scheme (BearerAuth, http/bearer, bearerFormat JWT) applied globally via a root-level
