idempotency:
  header: null
  coverage: partial
  scope:
  - POST /acknowledge_detections
  mechanism: natural-idempotency
  retention: n/a
  note: >-
    There is no Idempotency-Key header anywhere in the contract. What exists is a documented
    replay-safe contract on the single mutating operation - POST /acknowledge_detections is defined
    to return an already_acknowledged array for IDs that were in that state before the call, and its
    description states an acknowledged detection is not deleted, so re-sending the same detection_ids
    converges rather than double-applying. That is real replay protection, but it covers exactly one
    operation because the mutating surface IS one operation; it is recorded as partial rather than
    full because the mechanism is a per-operation semantic, not a key the client controls. If Adlumin
    adds any further write endpoint, nothing in the contract carries this guarantee over to it.
dry_run_mode:
  supported: false
  coverage: none
  note: No preview, validate-only or dry-run parameter exists on the mutating operation.
reversibility:
  applicable: true
  grade: none
  write_surface:
  - operation: POST /acknowledge_detections
    consequence: 'Removes detections from the active dashboard view for the whole tenant.'
    reversal_operation: null
    reversal_window: null
    note: >-
      No un-acknowledge, restore, or reverse operation is published, and no parameter on
      acknowledge_detections sets acknowledged back to false. The docs do state that acknowledgement
      is non-destructive - the detection remains queryable through GET /detections with
      acknowledged=true - so the underlying record survives, but recovering the pre-call dashboard
      state is not something the public API offers. The optional suppress_dashboard flag makes the
      effect broader, not narrower, and has no documented undo either. No window is asserted here
      because the documentation states none.
  summary: >-
    One write operation, no reversal path published. An agent acting on this API should treat
    acknowledgement as one-way from the API's point of view and confirm with a human before
    bulk-acknowledging, particularly with suppress_dashboard set.
