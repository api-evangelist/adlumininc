  envelope: PaginatedResponse allOf-composed with a typed data array
  cursor: false
  note: >-
    info.description calls this "cursor-style pagination", but the contract is page/per_page with a
    total_count - offset pagination by any other name. There is no cursor or next-page token, so a
    client walks pages by incrementing page until page * per_page >= total_count.
