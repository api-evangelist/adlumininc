- name: Adlumin MCP Server
  description: >-
    First-party Model Context Protocol server distributed by N-able as a downloadable Python package.
    Wraps the eleven Adlumin v1 REST endpoints as thirteen MCP tools (including two firewall
    aggregation tools with no dedicated REST path) so Claude Desktop, ChatGPT and GitHub Copilot can
    run SOC triage, executive briefings, Active Directory hygiene audits and compliance reporting
    against live tenant data.
  image: https://files.readme.io/c620a71e287577ffddb7a699ae4af380b1058444317a4e596f65ceacddea83f4-logo-light.svg
  humanURL: https://developer.n-able.com/adlumin/page/the-mcp-server-start-guide
