apis:
- name: Adlumin XDR/MDR API
  description: >-
    Tenant-scoped REST API over the Adlumin security operations platform. Eleven v1 endpoints return
    security detections (with bulk acknowledgement), at-risk Active Directory groups, network shares
    and systems, endpoint agent telemetry and device inventory, network health statistics, firewall
    event logs with geographic and blocked-IP aggregations, and compliance insights. Bearer JWT auth,
    page/per_page pagination with total_count, and since/until ISO 8601 date filtering.
  image: https://files.readme.io/c620a71e287577ffddb7a699ae4af380b1058444317a4e596f65ceacddea83f4-logo-light.svg
