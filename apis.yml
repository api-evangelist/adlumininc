aid: adlumininc
name: Adlumin
description: >-
  Adlumin is an N-able company providing a cloud-native security operations platform for mid-market
  organizations, financial institutions, government agencies and managed service providers. One license
  combines XDR, 24/7 expert-led MDR, SIEM log management, in-platform SOAR response actions, UEBA,
  darknet exposure monitoring, honeypots, identity threat detection and response, vulnerability
  management and audit-ready compliance reporting. Adlumin publishes a public developer portal on
  N-able's developer site carrying an OpenAPI 3.0.3 description of the Adlumin XDR/MDR v1 REST API
  (detections, at-risk assets, endpoint and device telemetry, network health, firewall events and
  compliance insights) plus a downloadable Python MCP server that exposes those same endpoints to AI
  assistants as thirteen agent tools.
