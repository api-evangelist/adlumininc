domain_standards:
  asserted: []
  note: >-
    REWARD-ONLY CHECK, HONESTLY EMPTY. The security-operations market does have machine-readable
    domain standards an XDR/SIEM contract could declare - OCSF event classes, STIX 2.1 / TAXII 2.1
    for indicator exchange, MITRE ATT&CK technique identifiers on a detection, OpenC2 for response
    actions, SCIM for user provisioning. None of them appears anywhere in the Adlumin contract:
    Detection carries a free-text detection_type ("Lateral Movement") rather than an ATT&CK technique
    ID, there is no STIX or TAXII surface, and no OCSF class_uid. A consumer already speaking any of
    those standards still needs a bespoke connector for Adlumin. Nothing is asserted here because
    nothing is declared; this is a gap in the contract, not a penalty.
